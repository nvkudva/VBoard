name: Release

# Publishing is driven by tags: push v1.2.3 (or v1.2.3-alpha.1) and this builds a
# signed APK and attaches it to a GitHub Release. Pre-release tags are marked as
# such automatically.
#
# A manual run can also create the tag first, by naming the branch or commit to
# cut it from in "ref". That exists for callers who can push branches but not
# tags — an agent session, or anyone working through the Actions UI. It is
# deliberately additive only: a tag that already exists is never moved or
# overwritten, so a published release cannot be rewritten from here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
      ref:
        description: "Branch or commit to create the tag at. Leave empty to build an existing tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # When "ref" is given the tag does not exist yet, so check out the
          # commit it is about to be cut from.
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}
          # The tag has to be pushed from this checkout, and the existence check
          # below needs the remote's tags.
          fetch-depth: 0

      - name: Create the tag
        if: ${{ github.event.inputs.ref != '' }}
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Tag must start with v; got $TAG." ; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Moving a tag rewrites what a published release points at, and
            # anyone who already downloaded that APK has no way to know. Pick a
            # new version instead.
            echo "::error::$TAG already exists. Tags are never moved; use a new version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # A tag pushed with GITHUB_TOKEN does not re-trigger this workflow's
          # push trigger, so this run stays the only build of it.
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the leading v for versionName: v1.0.0-alpha.1 -> 1.0.0-alpha.1
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A monotonic versionCode. run_number only ever increases for this
          # workflow, which is what Android requires; it does not have to encode
          # the version, only to be larger than the last published build.
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VBOARD_KEYSTORE_BASE64 is not set. The APK would be unsigned and uninstallable; refusing to publish. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          VBOARD_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VBOARD_KEYSTORE_PASSWORD: ${{ secrets.VBOARD_KEYSTORE_PASSWORD }}
          VBOARD_KEY_ALIAS: ${{ secrets.VBOARD_KEY_ALIAS }}
          VBOARD_KEY_PASSWORD: ${{ secrets.VBOARD_KEY_PASSWORD }}
          VBOARD_VERSION_NAME: ${{ steps.version.outputs.name }}
          VBOARD_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed APK was produced. Check the signing secrets."
            exit 1
          fi
          # apksigner is the only thing that proves installability; a build that
          # silently fell back to unsigned must not reach a release page.
          #
          # Pick exactly one apksigner: the runner has several build-tools
          # versions installed, so an unquoted glob expands to every one of them
          # and bash treats the first as the command and the rest as its
          # arguments ("Unsupported command: .../apksigner").
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          mv "$APK" "VBoard-${{ steps.version.outputs.name }}.apk"
          echo "APK_PATH=VBoard-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            "$APK_PATH"
