name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run core tests
        run: ./gradlew -Pvboard.skipAndroid=true :core:test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports
          path: core/build/reports/tests/

  android-build:
    name: Android build + lint + app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run all unit tests
        run: ./gradlew test --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: vboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-reports
          path: |
            app/build/reports/
            core/build/reports/

  release-build:
    # Separate job so an R8 failure is attributable at a glance rather than
    # hidden among the debug steps. The release build is the only thing that
    # exercises minification, and the keep rules for the sherpa-onnx JNI
    # entry points and MediaPipe's protobuf-lite reflection are hand-written:
    # without this, the first time R8 runs would be the release we ship.
    name: Release build (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload R8 mapping and usage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
