name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: ./gradlew -Pvboard.skipAndroid=true :core:test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/

  android-build:
    name: Android build + lint + app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run all unit tests
        run: ./gradlew test --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            core/build/reports/
